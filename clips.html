<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO BASICS -->
    <title>Clips | Lenka Z</title>
    <meta name="description" content="Video clips and acting scenes by Lenka Z, award-winning singer and actor based in New York City." />
    <meta name="keywords" content="Lenka Z clips, Lenka Z acting clips, Lenka Z video, actress scenes, film clips, singer actor" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Lenka Zviadadze" />

    <!-- Open Graph -->
    <meta property="og:title" content="Clips | Lenka Z" />
    <meta property="og:description" content="Watch acting and performance clips by Lenka Z." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lenkaz826.github.io/Lenkawebpage/clips.html" />

    <style>
        body {
            margin: 0;
            font-family: "Georgia", serif;
            background-color: #F5EDE3;
            color: #3E2C2A;
            line-height: 1.7;
        }

        a {
            color: #5C4637;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Header / Nav */
        .site-header {
            background-color: #E8D8C3;
            padding: 18px 5%;
            border-bottom: 1px solid #D6C5B2;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            letter-spacing: 0.15em;
            color: #4A352E;
            margin: 0;
        }

        .main-nav a {
            margin-left: 22px;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            padding-bottom: 3px;
        }

        .main-nav a.active {
            border-bottom: 2px solid #A67C52;
        }

        /* Main */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 5% 80px;
            text-align: center;
        }

        .section-title {
            font-size: 1.7rem;
            color: #4A352E;
            border-bottom: 3px solid #A67C52;
            display: inline-block;
            padding-bottom: 4px;
            margin-bottom: 20px;
        }

        .clip-card {
            background-color: #FAF4EC;
            border-radius: 12px;
            border: 1px solid #E0D5C6;
            box-shadow: 0 4px 18px rgba(92, 70, 55, 0.15);
            padding: 26px 22px 30px;
            max-width: 800px;
            margin: 0 auto 40px;
        }

        .clip-title {
            font-size: 1.2rem;
            margin: 0 0 6px;
            color: #3E2C2A;
            text-align: left;
        }

        .clip-subtitle {
            font-size: 0.9rem;
            color: #5C4637;
            text-align: left;
            margin-bottom: 8px;
        }

        .video-wrapper {
            margin-top: 15px;
        }

        .video-wrapper iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            border: 1px solid #D6C5B2;
            box-shadow: 0 4px 18px rgba(92, 70, 55, 0.15);
        }

        /* Footer */
        .site-footer {
            text-align: center;
            padding: 22px 5%;
            background-color: #E8D8C3;
            color: #4A352E;
            font-size: 0.9rem;
            margin-top: 50px;
        }

        /* HEADER FIX — SAME AS OTHER PAGES */
        @media (max-width: 900px) {
            .header-inner {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .main-nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 14px;
            }

            .main-nav a {
                margin: 0;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="header-inner">
        <h1 class="logo">LENKA Z</h1>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="resume.html">Resume</a>
            <a href="clips.html" class="active">Clips</a>
            <a href="bio.html">Bio</a>
        </nav>
    </div>
</header>

<main>
    <h2 class="section-title">Clips</h2>

    <!-- Acting Clip -->
    <div class="clip-card">
        <h3 class="clip-title">Scene Clip</h3>
        <div class="video-wrapper">
            <iframe
                src="https://www.youtube.com/embed/sbYCnsgh504"
                title="Scene Clip by Lenka Z"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Directed Short Film -->
    <div class="clip-card">
        <h3 class="clip-title">Short Film — Director</h3>
        <div class="clip-subtitle">Written &amp; Directed by Lenka Z</div>
        <div class="video-wrapper">
            <iframe
                src="https://player.vimeo.com/video/1146033718"
                title="Short Film directed by Lenka Z"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

</main>

<footer class="site-footer">
    © <span id="year"></span> Lenka Zviadadze. All rights reserved.
</footer>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
